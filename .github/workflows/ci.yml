name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Optimizer unit tests
        run: python tests/test_optimizer.py
      - name: Reorder property tests (exhaustive replay + minimality)
        run: python tests/test_reorder_property.py
      - name: Write-back safety tests
        run: python tests/test_update_flow.py

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Type check (src + tests)
        run: npm run typecheck
      - name: Cognitive engine tests
        run: npm test

  e2e:
    name: End-to-end (SOP flow, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci
      - name: Full SOP end-to-end suite
        # Drives the real CLIs in real subprocesses against a fake YouTube API:
        # no credentials, no network, no quota.  See tests/e2e/README.md.
        run: python tests/e2e/run_e2e.py

  skill-parity:
    name: Skill entrypoint parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SKILL.md must be identical across hosts
        # Claude Code and Gemini CLI each load their own copy of SKILL.md.  They
        # drifted once — the Gemini copy inlined a duplicate of AGENT_SOP.md that
        # then went stale and lost two of the four core rules.  Keeping the two
        # files byte-identical is what stops that happening again; anything that
        # needs to grow belongs in docs/agent/AGENT_SOP.md, not in SKILL.md.
        run: |
          diff -u .claude/skills/yt-playlist-manager/SKILL.md \
                  .gemini/skills/yt-playlist-manager/SKILL.md
